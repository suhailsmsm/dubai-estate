name: Build Windows Installer

# Builds DubaiEstate.exe (PyInstaller) then wraps it into the
# DubaiEstate-Setup installer (Inno Setup) on a free GitHub-hosted Windows
# runner, and uploads ONLY the installer as a downloadable artifact. The
# standalone portable DubaiEstate.exe is an intermediate build step and is
# not published. Run from the Actions tab (workflow_dispatch) or on tag pushes.

on:
  workflow_dispatch:        # manual: Actions tab → Run workflow
  push:
    tags: ["v*"]            # auto on version tags like v1.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt

      - name: Regenerate data bundles
        run: |
          python tools/build_bayut_history.py
          python tools/build_market_insights.py

      - name: Build exe with PyInstaller
        run: pyinstaller packaging/dxb_app.spec --noconfirm --log-level WARN

      - name: Show exe size
        shell: pwsh
        run: |
          $size = (Get-Item dist\DubaiEstate.exe).Length / 1MB
          Write-Host "DubaiEstate.exe size: $([math]::Round($size,2)) MB"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y
          
      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc packaging/installer.iss /Q

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DubaiEstate-installer
          path: dist/installer/DubaiEstate-Setup-*.exe
          if-no-files-found: error

      - name: Create Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/DubaiEstate-Setup-*.exe
          draft: true
