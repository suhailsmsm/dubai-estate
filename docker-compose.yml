services:
  db:
    image: postgis/postgis:16-3.4
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  elt:
    # Root context so the build can reach packages/dxb-core (shared schema).
    build:
      context: .
      dockerfile: elt/Dockerfile
    env_file: .env
    environment:
      DXB_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./elt/src:/app/src # dev: live code without rebuild
      - ./data:/app/data:ro # one-off CSV import source files (see docs/CSV_DATA_ANALYSIS.md)
    command: dxb run-scheduler

  api:
    # Root context so the build can reach packages/dxb-core (shared schema).
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DXB_DB_HOST: db # later: the read replica host — one value changes
    # Deliberately no depends_on: elt — the API serves reads whether or not
    # the scheduler is running, and neither can block the other's startup.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./api/src:/app/src # dev: live code without rebuild (mirrors elt)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 60s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
