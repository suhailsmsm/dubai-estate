<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dubai Estate Analytics</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;
  --accent:#f0a500;--accent2:#2ea043;--danger:#e05c5c;
  --text:#e6edf3;--muted:#8b949e;--radius:10px;
  --sidebar-w:260px;--header-h:56px;
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#app{display:flex;height:100vh;flex-direction:column}
header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 20px;flex-shrink:0;z-index:100}
header .logo{font-size:18px;font-weight:700;color:var(--accent);white-space:nowrap}
header .logo span{color:var(--text);font-weight:400}
header .nav-tabs{display:flex;gap:4px;margin-left:24px}
header .nav-tabs button{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;transition:all .15s}
header .nav-tabs button:hover{background:var(--surface2);color:var(--text)}
header .nav-tabs button.active{background:var(--surface2);color:var(--accent)}
header .spacer{flex:1}
#coverage-pill{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
#coverage-pill .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent2);margin-right:5px;vertical-align:middle}
#body{display:flex;flex:1;overflow:hidden}
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sidebar .sidebar-title{padding:14px 16px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#sidebar .filter-group{padding:0 12px 10px}
#sidebar label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
#sidebar select,#sidebar input[type=text]{width:100%;padding:7px 10px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:13px;outline:none}
#sidebar select:focus,#sidebar input:focus{border-color:var(--accent)}
#sidebar .metric-cards{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.stat-card .sc-label{font-size:11px;color:var(--muted);margin-bottom:3px}
.stat-card .sc-value{font-size:20px;font-weight:700;color:var(--text)}
.stat-card .sc-sub{font-size:11px;color:var(--muted);margin-top:2px}
#sidebar .divider{border:none;border-top:1px solid var(--border);margin:4px 12px}
#sidebar .area-list-wrap{flex:1;overflow-y:auto;padding:0 12px 12px}
#sidebar .area-list-wrap::-webkit-scrollbar{width:4px}
#sidebar .area-list-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.area-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .12s;gap:8px}
.area-item:hover{background:var(--surface2)}
.area-item.selected{background:rgba(240,165,0,.1);border:1px solid rgba(240,165,0,.3)}
.area-item .ai-rank{width:20px;font-size:11px;color:var(--muted);flex-shrink:0;text-align:right}
.area-item .ai-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.area-item .ai-val{font-size:12px;font-weight:600;color:var(--accent);flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.page{flex:1;overflow:hidden;display:none}
.page.active{display:flex}
#page-map{position:relative}
#map{width:100%;height:100%}
#map-legend{position:absolute;bottom:24px;right:12px;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;min-width:160px}
#map-legend .leg-title{font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:600;text-transform:uppercase}
.leg-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.leg-swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0}
#map-controls{position:absolute;top:12px;left:12px;z-index:1000;display:flex;flex-direction:column;gap:8px}
#map-controls select{padding:7px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;outline:none;min-width:180px}
#map-controls select:focus{border-color:var(--accent)}
.leaflet-container{background:#1a1e27}
#page-ranking{flex-direction:column;overflow:hidden}
.ranking-toolbar{padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ranking-toolbar label{font-size:12px;color:var(--muted);margin-right:4px}
.ranking-toolbar select{padding:6px 10px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:13px;outline:none}
.ranking-toolbar select:focus{border-color:var(--accent)}
#ranking-table-wrap{flex:1;overflow-y:auto;padding:0 20px 20px}
#ranking-table-wrap::-webkit-scrollbar{width:5px}
#ranking-table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.rtable{width:100%;border-collapse:collapse;margin-top:16px}
.rtable th{text-align:left;padding:10px 12px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:2}
.rtable td{padding:10px 12px;border-bottom:1px solid rgba(48,54,61,.5);vertical-align:middle}
.rtable tr:hover td{background:var(--surface2)}
.rtable .rank-num{color:var(--muted);font-size:12px;width:40px}
.rtable .name-cell{font-weight:500}
.rtable .num-cell{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.rtable .num-cell.highlight{color:var(--accent);font-weight:600}
.rtable .bar-cell{width:120px}
.bar-bg{background:var(--surface2);border-radius:3px;height:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.rtable tr{cursor:pointer}
.rtable tr:hover .name-cell{color:var(--accent)}
#page-growth{flex-direction:column;overflow:hidden}
.growth-toolbar{padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.growth-toolbar input[type=text]{padding:7px 12px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:13px;outline:none;width:240px}
.growth-toolbar input:focus{border-color:var(--accent)}
.growth-toolbar select{padding:7px 10px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:13px;outline:none}
.btn{padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:500;background:var(--accent);color:#000;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
#growth-content{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:20px}
#growth-content::-webkit-scrollbar{width:5px}
#growth-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.growth-header{display:flex;gap:12px;flex-wrap:wrap}
.metric-pill{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;min-width:160px}
.metric-pill .mp-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.metric-pill .mp-value{font-size:22px;font-weight:700;margin-top:2px}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}
.empty-state .es-title{font-size:16px;color:var(--text);margin-bottom:6px}
.empty-state .es-sub{font-size:13px}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted)}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Dubai<span> Estate Analytics</span></div>
    <div class="nav-tabs">
      <button class="active" onclick="setPage('map')">Map</button>
      <button onclick="setPage('ranking')">Rankings</button>
      <button onclick="setPage('growth')">Growth</button>
      <button onclick="location.href='pricing-history.html'">Pricing History</button>
      <button onclick="location.href='ai-assistant.html'">AI Assistant</button>
    </div>
    <div class="spacer"></div>
    <div id="coverage-pill"><span class="dot"></span><span id="coverage-text">Loading...</span></div>
  </header>
  <div id="body">
    <aside id="sidebar">
      <div class="sidebar-title">Filters</div>
      <div class="filter-group">
        <label for="sb-city">City</label>
        <select id="sb-city" onchange="loadSidebarList()">
          <option value="">All cities</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="sb-metric">Sort by</label>
        <select id="sb-metric" onchange="loadSidebarList()">
          <option value="gross_yield_pct">Gross Yield %</option>
          <option value="med_sale">Median Sale Price</option>
          <option value="med_rent_annual">Median Rent/yr</option>
          <option value="cagr_pct">Rent CAGR %</option>
        </select>
      </div>
      <div class="metric-cards">
        <div class="stat-card">
          <div class="sc-label">Total Listings</div>
          <div class="sc-value" id="st-listings">—</div>
          <div class="sc-sub" id="st-listings-sub">rent + sale</div>
        </div>
        <div class="stat-card">
          <div class="sc-label">Areas Covered</div>
          <div class="sc-value" id="st-areas">—</div>
          <div class="sc-sub" id="st-areas-sub">with data</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="sidebar-title">Top Areas</div>
      <div class="area-list-wrap" id="area-list">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </aside>
    <main id="main">
      <!-- Map Page -->
      <div id="page-map" class="page active">
        <div id="map"></div>
        <div id="map-legend">
          <div class="leg-title">Gross Yield %</div>
          <div class="leg-row"><div class="leg-swatch" style="background:#2ea043"></div> > 6%</div>
          <div class="leg-row"><div class="leg-swatch" style="background:#f0a500"></div> 4–6%</div>
          <div class="leg-row"><div class="leg-swatch" style="background:#e05c5c"></div> < 4%</div>
        </div>
      </div>
      <!-- Rankings Page -->
      <div id="page-ranking" class="page">
        <div class="ranking-toolbar">
          <label>Sort by:</label>
          <select id="rank-metric" onchange="loadRanking()">
            <option value="gross_yield_pct">Gross Yield %</option>
            <option value="med_sale">Median Sale</option>
            <option value="med_rent_annual">Median Rent</option>
            <option value="cagr_pct">Rent CAGR %</option>
          </select>
          <label>City:</label>
          <select id="rank-city" onchange="loadRanking()">
            <option value="">All</option>
          </select>
          <label>Limit:</label>
          <select id="rank-limit" onchange="loadRanking()">
            <option value="20">Top 20</option>
            <option value="50">Top 50</option>
            <option value="100">Top 100</option>
          </select>
        </div>
        <div id="ranking-table-wrap">
          <table class="rtable" id="ranking-table">
            <thead><tr><th>#</th><th>Area</th><th>City</th><th class="num-cell">Yield %</th><th class="num-cell">Sale AED</th><th class="num-cell">Rent/yr</th><th class="num-cell">CAGR %</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <!-- Growth Page -->
      <div id="page-growth" class="page">
        <div class="growth-toolbar">
          <input type="text" id="growth-search" placeholder="Search area..." oninput="loadGrowth()">
          <select id="growth-city" onchange="loadGrowth()">
            <option value="">All cities</option>
          </select>
        </div>
        <div id="growth-content">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="data/market-insights.js"></script>
<script src="data/bayut-pricing-history.js"></script>
<script>
// Data from bundled JS files
const MI = window.MARKET_INSIGHTS;
const BH = window.BAYUT_HISTORY;

const fmt = {
  num: v => v == null ? '—' : Number(v).toLocaleString('en-US', {maximumFractionDigits: 0}),
  aed: v => v == null ? '—' : 'AED ' + Number(v).toLocaleString('en-US', {maximumFractionDigits: 0}),
  pct: v => v == null ? '—' : Number(v).toFixed(1) + '%',
};

let state = {
  selectedArea: null,
  currentPage: 'map',
  map: null,
  markers: [],
  areaMarkers: {}
};

// Online status indicator
function updateOnlineStatus() {
  const pill = document.getElementById('coverage-pill');
  const isOnline = navigator.onLine;
  pill.innerHTML = `<span class="dot" style="background:${isOnline ? 'var(--accent2)' : 'var(--danger)'}"></span><span>${isOnline ? 'Online' : 'Offline'}</span>`;
}

// Initialize
function bootstrap() {
  // Check internet connectivity and show status
  updateOnlineStatus();
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  
  if (!MI) {
    document.getElementById('coverage-text').textContent = 'No data loaded';
    document.getElementById('area-list').innerHTML = '<div class="empty-state"><div class="es-icon">⚠️</div><div class="es-title">Data not found</div><div class="es-sub">market-insights.js not loaded</div></div>';
    return;
  }
  
  // Populate stats
  document.getElementById('st-listings').textContent = fmt.num(MI.summary.listings_total);
  document.getElementById('st-areas').textContent = fmt.num(MI.summary.areas);
  document.getElementById('coverage-text').textContent = MI.summary.areas + ' areas · ' + MI.summary.listings_total + ' listings';
  
  // Populate city dropdowns
  const cities = ['', ...MI.summary.cities];
  const cityOpts = cities.map(c => `<option value="${c}">${c || 'All cities'}</option>`).join('');
  document.getElementById('sb-city').innerHTML = cityOpts;
  document.getElementById('rank-city').innerHTML = cityOpts;
  document.getElementById('growth-city').innerHTML = cityOpts;
  
  loadSidebarList();
  initMap();
}

function setPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(name)));
  state.currentPage = name;
  
  if (name === 'ranking') loadRanking();
  if (name === 'growth') loadGrowth();
}

function loadSidebarList() {
  const metric = document.getElementById('sb-metric').value;
  const city = document.getElementById('sb-city').value;
  const el = document.getElementById('area-list');
  
  let areas = MI.areas.slice();
  if (city) areas = areas.filter(a => a.city === city);
  
  // Sort by selected metric
  areas.sort((a, b) => (b[metric] || 0) - (a[metric] || 0));
  
  const displayMetric = {
    'gross_yield_pct': a => fmt.pct(a.gross_yield_pct),
    'med_sale': a => fmt.aed(a.med_sale),
    'med_rent_annual': a => fmt.aed(a.med_rent_annual),
    'cagr_pct': a => fmt.pct(a.cagr_pct)
  };
  
  el.innerHTML = areas.slice(0, 20).map((a, i) => `
    <div class="area-item" onclick="selectArea('${a.key.replace(/'/g, "\\'")}')">
      <span class="ai-rank">${i + 1}</span>
      <span class="ai-name" title="${a.area}">${a.area}</span>
      <span class="ai-val">${displayMetric[metric](a)}</span>
    </div>
  `).join('') || '<div style="padding:12px;color:var(--muted)">No areas found</div>';
}

function selectArea(key) {
  state.selectedArea = key;
  document.querySelectorAll('.area-item').forEach(el => el.classList.remove('selected'));
  event.target.closest('.area-item')?.classList.add('selected');
}

// Map
function initMap() {
  if (state.map) return;
  
  state.map = L.map('map').setView([25.2, 55.3], 10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    maxZoom: 18
  }).addTo(state.map);
  
  // Dubai area coordinates (approximate centers)
  const areaCoords = {
    'dubai': {lat: 25.2048, lng: 55.2708},
    'dubai-marina': {lat: 25.0805, lng: 55.1405},
    'downtown-dubai': {lat: 25.1972, lng: 55.2796},
    'business-bay': {lat: 25.1896, lng: 55.2615},
    'jbr': {lat: 25.0725, lng: 55.1333},
    'jvc': {lat: 25.0515, lng: 55.2335},
    'jlt': {lat: 25.0657, lng: 55.1422},
    'palm-jumeirah': {lat: 25.1121, lng: 55.1390},
    'dubai-hills': {lat: 25.0657, lng: 55.3512},
    'arabian-ranches': {lat: 25.0443, lng: 55.2866},
    'dubai-silicon-oasis': {lat: 25.0657, lng: 55.3877},
    'dubai-sports-city': {lat: 25.0525, lng: 55.2712},
    'dubai-production-city': {lat: 25.0450, lng: 55.2475},
    'dubai-investment-park': {lat: 24.9750, lng: 55.2500},
    'meydan': {lat: 25.1650, lng: 55.3300},
    'dubai-creek-harbour': {lat: 25.1950, lng: 55.3400},
    'city-walk': {lat: 25.2100, lng: 55.2600},
    'dubai-design-district': {lat: 25.2050, lng: 55.2800},
    'al-barsha': {lat: 25.0950, lng: 55.2250},
    'al-quoz': {lat: 25.1150, lng: 55.2350},
    'karama': {lat: 25.2450, lng: 55.3000},
    'bur-dubai': {lat: 25.2650, lng: 55.2950},
    'deira': {lat: 25.2750, lng: 55.3200},
    'al-satwa': {lat: 25.2150, lng: 55.2700},
    'al-karama': {lat: 25.2450, lng: 55.3000},
    'umm-suqeim': {lat: 25.1550, lng: 55.2000},
    'al-thanya': {lat: 25.2250, lng: 55.2800},
    'al-mankhool': {lat: 25.2550, lng: 55.2900},
    'al-ras': {lat: 25.2700, lng: 55.3100},
    'al-fahidi': {lat: 25.2680, lng: 55.2950},
    'al-mamzar': {lat: 25.2900, lng: 55.3400},
    'al-qusais': {lat: 25.2800, lng: 55.3800},
    'al-twar': {lat: 25.2600, lng: 55.3700},
    'mirdif': {lat: 25.2200, lng: 55.4000},
    'al-warqa': {lat: 25.2000, lng: 55.4200},
    'nad-al-hamar': {lat: 25.1800, lng: 55.3900},
    'al-awir': {lat: 25.1500, lng: 55.4500},
    'hatta': {lat: 24.8000, lng: 56.1000},
    'abu-dhabi': {lat: 24.4539, lng: 54.3773},
    'sharjah': {lat: 25.3573, lng: 55.4033},
    'al-ain': {lat: 24.2075, lng: 55.7447}
  };
  
  // Add markers for areas with data
  MI.areas.forEach(area => {
    const key = area.area.toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]/g, '');
    const coords = areaCoords[key] || areaCoords[area.city];
    
    if (coords && area.gross_yield_pct != null) {
      // Color based on yield
      let color = '#e05c5c'; // red < 4%
      if (area.gross_yield_pct >= 6) color = '#2ea043'; // green >= 6%
      else if (area.gross_yield_pct >= 4) color = '#f0a500'; // yellow 4-6%
      
      const marker = L.circleMarker([coords.lat, coords.lng], {
        radius: 8,
        fillColor: color,
        color: '#fff',
        weight: 1,
        opacity: 1,
        fillOpacity: 0.8
      }).addTo(state.map);
      
      marker.bindPopup(`
        <div style="font-family:-apple-system,sans-serif;min-width:180px">
          <div style="font-weight:600;font-size:14px;margin-bottom:6px">${area.area}</div>
          <div style="font-size:12px;color:#666;text-transform:capitalize">${area.city}</div>
          <div style="margin-top:8px;font-size:12px">
            <div><strong>Yield:</strong> ${fmt.pct(area.gross_yield_pct)}</div>
            ${area.med_sale ? `<div><strong>Sale:</strong> ${fmt.aed(area.med_sale)}</div>` : ''}
            ${area.med_rent_annual ? `<div><strong>Rent:</strong> ${fmt.aed(area.med_rent_annual)}/yr</div>` : ''}
            ${area.cagr_pct != null ? `<div><strong>CAGR:</strong> ${fmt.pct(area.cagr_pct)}</div>` : ''}
          </div>
        </div>
      `);
      
      state.areaMarkers[area.key] = marker;
    }
  });
}

// Rankings
function loadRanking() {
  const metric = document.getElementById('rank-metric').value;
  const city = document.getElementById('rank-city').value;
  const limit = parseInt(document.getElementById('rank-limit').value);
  
  let areas = MI.areas.slice();
  if (city) areas = areas.filter(a => a.city === city);
  areas.sort((a, b) => (b[metric] || 0) - (a[metric] || 0));
  
  const tbody = document.querySelector('#ranking-table tbody');
  tbody.innerHTML = areas.slice(0, limit).map((a, i) => `
    <tr onclick="selectArea('${a.key.replace(/'/g, "\\'")}')">
      <td class="rank-num">${i + 1}</td>
      <td class="name-cell">${a.area}</td>
      <td style="text-transform:capitalize">${a.city}</td>
      <td class="num-cell ${metric === 'gross_yield_pct' ? 'highlight' : ''}">${fmt.pct(a.gross_yield_pct)}</td>
      <td class="num-cell ${metric === 'med_sale' ? 'highlight' : ''}">${fmt.aed(a.med_sale)}</td>
      <td class="num-cell ${metric === 'med_rent_annual' ? 'highlight' : ''}">${fmt.aed(a.med_rent_annual)}</td>
      <td class="num-cell ${metric === 'cagr_pct' ? 'highlight' : ''}">${fmt.pct(a.cagr_pct)}</td>
    </tr>
  `).join('');
}

// Growth
function loadGrowth() {
  const search = document.getElementById('growth-search').value.toLowerCase();
  const city = document.getElementById('growth-city').value;
  const el = document.getElementById('growth-content');
  
  let areas = MI.areas.filter(a => a.history && a.history.length > 0);
  if (city) areas = areas.filter(a => a.city === city);
  if (search) areas = areas.filter(a => a.area.toLowerCase().includes(search));
  
  if (!areas.length) {
    el.innerHTML = '<div class="empty-state"><div class="es-icon">📊</div><div class="es-title">No growth data</div><div class="es-sub">No areas match the filters</div></div>';
    return;
  }
  
  // Show top areas with history
  el.innerHTML = areas.slice(0, 10).map(a => `
    <div class="metric-pill">
      <div class="mp-label">${a.area} <span style="color:var(--muted);text-transform:capitalize">(${a.city})</span></div>
      <div class="mp-value">${fmt.pct(a.cagr_pct)} <span style="font-size:12px;color:var(--muted)">CAGR</span></div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">
        ${a.first_year || '—'} → ${a.last_year || '—'} · ${a.history.length} data points
      </div>
    </div>
  `).join('');
}

// Start
bootstrap();
</script>
</body>
</html>
